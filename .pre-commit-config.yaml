repos:
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 24.8.0
    hooks:
      - id: black
        exclude: migrations/
        language_version: python3.12
  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        args: ["--max-line-length=88", "--extend-ignore=E203,E701"]
        exclude: migrations/
  - repo: local
    hooks:
      - id: run-tests
        name: Run All Tests Before Commit
        entry: bash -c 'cd townhall && if [ -x ../.venv/Scripts/python.exe ]; then ../.venv/Scripts/python.exe manage.py test; elif [ -x ../.venv/bin/python ]; then ../.venv/bin/python manage.py test; else python manage.py test; fi'
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
